name: UpdateReadme
on:
  # Regenerate metrics weekly so the SVG doesn't go stale
  schedule:
    - cron: "0 4 * * 1"
  # Allow manual runs from the Actions tab
  workflow_dispatch:
  push:
    branches:
      - "main"
jobs:
  metrics_job:
    runs-on: ubuntu-latest
    # Skip runs triggered by the action's own commit
    if: ${{ !contains(github.event.head_commit.message, '[Skip GitHub Action]') }}
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          plugin_languages: yes
          plugin_languages_indepth: yes
          commits_authoring: Sergi Micó Ortiz, sergimicoortiz, sergimicoortiz@gmail.com
          token: ${{ secrets.TOKEN }}
